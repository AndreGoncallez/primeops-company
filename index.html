<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeOps — Operational Intelligence &amp; Exposure Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1628;
    --navy-2:#10203A;
    --white:#FFFFFF;
    --paper:#F4F5F7;
    --graphite:#232A33;
    --slate:#667085;
    --blue-accent:#2E5578;
    --blue-accent-hover:#3A6790;
    --copper:#C47A3A;
    --line-l:rgba(35,42,51,0.13);
    --line-d:rgba(255,255,255,0.14);
    --serif:'Fraunces', serif;
    --sans:'IBM Plex Sans', sans-serif;
    --mono:'IBM Plex Mono', monospace;
    --maxw:1180px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    color:var(--graphite);
    background:var(--white);
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 40px;}
  @media (max-width:640px){ .wrap{padding:0 24px;} }

  /* HEADER */
  header{
    position:sticky;top:0;z-index:80;
    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line-l);
  }
  nav{
    max-width:var(--maxw);margin:0 auto;padding:22px 40px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{
    font-family:var(--serif);font-weight:600;font-size:19px;
    color:var(--navy);letter-spacing:0.01em;
  }
  .navlinks{display:flex;gap:38px;}
  .navlinks a{font-size:14px;color:var(--slate);}
  .navlinks a:hover{color:var(--navy);}
  .nav-right{display:flex;align-items:center;gap:26px;}
  .lang-toggle{display:flex;gap:2px;font-family:var(--mono);font-size:11.5px;}
  .lang-toggle button{
    background:none;border:1px solid var(--line-l);
    padding:5px 9px;color:var(--slate);cursor:pointer;
  }
  .lang-toggle button.active{
    background:var(--navy);color:#fff;border-color:var(--navy);
  }
  .btn-contact{
    font-size:13.5px;color:var(--navy);
    border-bottom:1px solid var(--navy);
    padding-bottom:2px;cursor:pointer;
  }
  @media (max-width:860px){ .navlinks{display:none;} }

  /* HERO */
  .hero{padding:100px 0 90px;}
  .hero-grid{
    display:grid;grid-template-columns:1.08fr 0.92fr;gap:70px;align-items:center;
  }
  @media (max-width:940px){ .hero-grid{grid-template-columns:1fr;gap:56px;} }

  .eyebrow{
    font-size:12.5px;letter-spacing:0.12em;color:var(--copper);
    margin-bottom:22px;font-weight:600;
  }
  h1{
    font-family:var(--serif);font-weight:500;
    font-size:clamp(32px,4vw,46px);
    line-height:1.22;color:var(--navy);
    letter-spacing:-0.01em;margin-bottom:28px;
  }
  .hero-sub{
    color:var(--slate);font-size:16px;max-width:48ch;
    line-height:1.75;margin-bottom:38px;
  }
  .hero-ctas{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .btn-primary{
    background:var(--blue-accent);color:#fff;
    padding:14px 26px;font-size:14px;font-weight:600;
    border-radius:2px;
    transition:background-color .15s ease;
    display:inline-block;cursor:pointer;border:none;
  }
  .btn-primary:hover{background:var(--blue-accent-hover);}
  .btn-ghost{font-size:14px;color:var(--navy);border-bottom:1px solid var(--line-l);padding-bottom:2px;}

  /* DIAGRAM */
  .diagram-panel{
    border:1px solid var(--line-l);border-radius:2px;
    padding:48px 36px 40px;background:var(--paper);
  }
  .diagram{display:flex;flex-direction:column;align-items:center;}
  .d-top{
    display:flex;align-items:center;gap:8px;
    font-family:var(--serif);font-size:14px;letter-spacing:0.04em;color:var(--navy);
  }
  .d-dot{width:6px;height:6px;border-radius:50%;background:var(--copper);}
  .d-trunk{width:1px;height:26px;background:var(--line-l);}
  .d-trunk.short{height:20px;}
  .d-branches{
    display:flex;width:100%;justify-content:space-between;
    border-top:1px solid var(--line-l);padding-top:0;
  }
  .d-branch{flex:1;display:flex;flex-direction:column;align-items:center;}
  .d-drop{width:1px;height:20px;background:var(--line-l);}
  .d-leaf{font-size:12.5px;color:var(--slate);margin-top:10px;text-align:center;}
  .d-node{
    font-family:var(--serif);font-size:15px;letter-spacing:0.03em;
    color:var(--navy);text-align:center;
  }

  .brandstrip{
    border-top:1px solid var(--line-l);border-bottom:1px solid var(--line-l);
    padding:34px 0;text-align:center;
  }
  .brandstrip .b1{font-family:var(--serif);font-size:15px;letter-spacing:0.06em;color:var(--navy);margin-bottom:6px;}
  .brandstrip .b2{font-size:13px;color:var(--slate);}

  /* METRICS STRIP */
  .metrics-strip{
    display:grid;grid-template-columns:repeat(4,1fr);
    background:var(--paper);border-bottom:1px solid var(--line-l);padding:30px 0;
  }
  @media (max-width:760px){ .metrics-strip{grid-template-columns:repeat(2,1fr);gap:20px;} }
  .metric-item{text-align:center;padding:0 10px;}
  .metric-val{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600;}
  .metric-lbl{font-size:12px;color:var(--slate);margin-top:4px;font-family:var(--mono);}

  section.block{padding:96px 0;}
  .head{max-width:660px;margin-bottom:56px;}
  h2{
    font-family:var(--serif);font-weight:500;
    font-size:clamp(26px,3vw,34px);line-height:1.28;
    color:var(--navy);letter-spacing:-0.01em;
  }
  .head p{color:var(--slate);font-size:15px;margin-top:18px;max-width:58ch;line-height:1.75;}

  .problem-cols{
    display:grid;grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--line-l);
  }
  @media (max-width:820px){ .problem-cols{grid-template-columns:1fr;} }
  .problem-col{
    padding:34px 34px 34px 0;border-right:1px solid var(--line-l);
  }
  .problem-col:last-child{border-right:none;}
  @media (max-width:820px){ .problem-col{border-right:none;border-bottom:1px solid var(--line-l);padding:28px 0;} }
  .problem-col .pk{font-size:12px;letter-spacing:0.1em;color:var(--copper);font-weight:600;margin-bottom:14px;}
  .problem-col h3{font-family:var(--serif);font-size:20px;color:var(--navy);font-weight:500;}

  /* WHAT WE DO */
  .whatwedo{background:var(--navy);color:#EDEEF0;}
  .whatwedo .head h2{color:#F5F6F7;}
  .whatwedo .head p{color:#A9B2C0;}
  .wwd-grid{
    display:grid;grid-template-columns:1fr 1fr;
    border-top:1px solid var(--line-d);
  }
  @media (max-width:760px){ .wwd-grid{grid-template-columns:1fr;} }
  .wwd-cell{
    padding:38px 40px 38px 0;
    border-bottom:1px solid var(--line-d);
  }
  .wwd-grid > .wwd-cell:nth-child(odd){border-right:1px solid var(--line-d);padding-right:40px;}
  @media (max-width:760px){ .wwd-grid > .wwd-cell:nth-child(odd){border-right:none;} }
  .wwd-cell .wnum{font-family:var(--mono);font-size:12px;color:var(--copper);margin-bottom:16px;}
  .wwd-cell h3{font-family:var(--serif);font-size:19px;font-weight:500;color:#F5F6F7;margin-bottom:10px;}
  .wwd-cell p{color:#9BA5B4;font-size:14px;line-height:1.7;max-width:38ch;}

  /* MOCKUP DO AGENTE CONVERSACIONAL */
  .agent-preview-section{
    background:var(--navy-2);padding:70px 0;color:#fff;border-top:1px solid var(--line-d);
  }
  .chat-mockup{
    max-width:720px;margin:30px auto 0;background:var(--navy);
    border:1px solid var(--line-d);border-radius:4px;padding:24px;
    font-family:var(--sans);font-size:13.5px;box-shadow:0 12px 40px rgba(0,0,0,0.3);
  }
  .chat-header{
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--line-d);padding-bottom:12px;margin-bottom:20px;
  }
  .chat-status{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:#8A96A8;}
  .chat-status-dot{width:8px;height:8px;border-radius:50%;background:#4CAF50;}
  .chat-msg{margin-bottom:14px;display:flex;flex-direction:column;}
  .chat-msg.user{align-items:flex-end;}
  .chat-msg.bot{align-items:flex-start;}
  .chat-bubble{
    padding:10px 16px;border-radius:4px;max-width:80%;line-height:1.5;
  }
  .chat-msg.user .chat-bubble{background:var(--blue-accent);color:#fff;}
  .chat-msg.bot .chat-bubble{background:rgba(255,255,255,0.07);color:#E0E4EC;border:1px solid var(--line-d);}
  .chat-time{font-size:10px;color:#707D8F;margin-top:4px;font-family:var(--mono);}

  /* INDUSTRIES GRID */
  .ind-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;
  }
  @media (max-width:900px){ .ind-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:500px){ .ind-grid{grid-template-columns:1fr;} }
  .ind-card{
    border:1px solid var(--line-l);padding:24px;background:var(--white);
  }
  .ind-card .icon{font-size:22px;margin-bottom:12px;color:var(--copper);}
  .ind-card h4{font-family:var(--serif);color:var(--navy);font-size:16px;margin-bottom:8px;}
  .ind-card p{font-size:12.5px;color:var(--slate);line-height:1.5;}

  /* METHOD */
  .method-device{
    margin:0 0 60px;padding:40px 0;
    border-top:1px solid var(--line-l);border-bottom:1px solid var(--line-l);
    overflow-x:auto;
  }
  .method-row{
    display:flex;align-items:flex-end;gap:0;min-width:640px;
  }
  .method-unit{
    display:flex;flex-direction:column;align-items:center;
    flex:1;text-align:center;position:relative;
  }
  .method-unit .mletter{
    font-family:var(--mono);font-weight:600;font-size:26px;color:var(--copper);
  }
  .method-unit .mword{
    font-size:12px;color:var(--slate);margin-top:10px;letter-spacing:0.02em;
  }
  .method-connector{
    flex:0 0 auto;width:28px;height:1px;background:var(--line-l);
    align-self:center;margin-bottom:26px;
  }
  .method-quote{
    font-family:var(--serif);font-style:italic;
    font-size:clamp(19px,2.2vw,24px);color:var(--navy);
    text-align:center;max-width:56ch;margin:0 auto;line-height:1.55;
  }

  /* SOLUTIONS */
  .solutions{background:var(--paper);}
  .sol-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:1px;
    background:var(--line-l);border:1px solid var(--line-l);
    margin-top:8px;
  }
  @media (max-width:760px){ .sol-grid{grid-template-columns:1fr;} }
  .sol-cell{background:var(--paper);padding:36px 34px;}
  .sol-cell h3{font-family:var(--serif);font-size:19px;font-weight:500;color:var(--navy);margin-bottom:12px;}
  .sol-cell p{color:var(--slate);font-size:14px;line-height:1.7;}

  /* PRICING MODULAR GRID */
  .pricing-grid{
    display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
    margin-top:24px;
  }
  @media (max-width:1024px){ .pricing-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .pricing-grid{grid-template-columns:1fr;} }
  
  .price-card{
    border:1px solid var(--line-l);border-radius:2px;
    padding:30px 22px;background:var(--white);
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .price-card.featured{
    border-color:var(--blue-accent);
    box-shadow:0 10px 30px rgba(10,22,40,0.05);
  }
  .price-tag{font-family:var(--mono);font-size:10px;color:var(--copper);letter-spacing:0.1em;margin-bottom:12px;font-weight:600;}
  .price-card h3{font-family:var(--serif);font-size:18px;color:var(--navy);margin-bottom:8px;}
  .price-card .desc{font-size:13px;color:var(--slate);margin-bottom:18px;line-height:1.5;}
  .price-amount{font-family:var(--serif);font-size:28px;color:var(--navy);font-weight:600;margin-bottom:6px;}
  .price-amount span{font-family:var(--sans);font-size:13px;color:var(--slate);font-weight:400;}
  .price-setup{font-size:11.5px;color:var(--copper);font-family:var(--mono);margin-bottom:16px;}
  .price-features{list-style:none;margin-bottom:24px;font-size:12.5px;color:var(--graphite);}
  .price-features li{margin-bottom:8px;padding-left:16px;position:relative;}
  .price-features li::before{content:"✓";position:absolute;left:0;color:var(--blue-accent);font-weight:bold;}
  
  .btn-card{
    width:100%;text-align:center;padding:11px 0;font-size:12.5px;font-weight:600;
    border:1px solid var(--navy);color:var(--navy);border-radius:2px;display:block;cursor:pointer;
  }
  .btn-card.primary{background:var(--navy);color:#fff;}
  .btn-card.wise{background:var(--paper);border-color:var(--line-l);color:var(--navy);}

  /* EVIDENCE */
  .evidence-cols{
    display:grid;grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line-l);
  }
  @media (max-width:820px){ .evidence-cols{grid-template-columns:1fr 1fr;} }
  .evidence-col{padding:30px 28px 30px 0;border-right:1px solid var(--line-l);}
  .evidence-col:last-child{border-right:none;}
  @media (max-width:820px){
    .evidence-col{border-right:none;border-bottom:1px solid var(--line-l);padding:24px 0;}
  }
  .evidence-col .ek{font-family:var(--serif);font-size:17px;color:var(--navy);margin-bottom:8px;}
  .evidence-col p{color:var(--slate);font-size:13.5px;line-height:1.6;}

  /* ABOUT */
  .about-inner{max-width:660px;}
  .about-kicker{font-size:12.5px;letter-spacing:0.1em;color:var(--copper);font-weight:600;margin-bottom:18px;}
  .about-inner p{color:var(--slate);font-size:15px;line-height:1.8;margin-top:20px;max-width:58ch;}

  /* CTA */
  .finalcta{background:var(--navy);color:#fff;text-align:center;padding:120px 0;}
  .finalcta h2{
    color:#F5F6F7;font-size:clamp(26px,3.6vw,40px);
    letter-spacing:0.01em;margin-bottom:20px;
  }
  .finalcta p{color:#A9B2C0;font-size:15.5px;margin-bottom:38px;}
  .finalcta .email-contacts{margin-top:24px;font-size:13px;color:#8A96A8;}

  /* MODAL POPUP */
  .modal-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(10,22,40,0.8);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-overlay.active{display:flex;}
  .modal-box{
    background:var(--white);padding:36px;max-width:560px;width:90%;
    border-radius:2px;border:1px solid var(--line-l);position:relative;
    max-height:90vh;overflow-y:auto;
  }
  .modal-close{
    position:absolute;top:16px;right:20px;font-size:20px;cursor:pointer;color:var(--slate);
  }
  .modal-box h3{font-family:var(--serif);color:var(--navy);font-size:22px;margin-bottom:6px;}
  .modal-box p{font-size:13px;color:var(--slate);margin-bottom:20px;}
  
  .form-group{margin-bottom:14px;}
  .form-group label{display:block;font-size:11px;font-family:var(--mono);color:var(--slate);margin-bottom:4px;}
  .form-group input[type="text"], .form-group input[type="email"], .form-group textarea{
    width:100%;padding:9px 12px;border:1px solid var(--line-l);font-family:var(--sans);font-size:13.5px;
  }
  
  .checkbox-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
  .checkbox-item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--graphite);}
  .checkbox-item input{cursor:pointer;}

  .lgpd-consent{
    display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:var(--slate);
    margin-top:14px;margin-bottom:16px;line-height:1.4;
  }
  .lgpd-consent input{margin-top:2px;cursor:pointer;}

  .btn-submit{
    width:100%;padding:12px;background:var(--navy);color:#fff;font-weight:600;font-size:14px;border:none;cursor:pointer;
  }

  /* FOOTER */
  footer{padding:50px 0 34px;border-top:1px solid var(--line-l);}
  .footer-top{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:26px;margin-bottom:30px;
  }
  .footer-brand .fb1{font-family:var(--serif);font-size:17px;color:var(--navy);}
  .footer-brand .fb2{font-size:12.5px;color:var(--slate);margin-top:4px;}
  .footer-links{display:flex;gap:24px;}
  .footer-links a{font-size:13px;color:var(--slate);}
  .footer-links a:hover{color:var(--navy);}
  .footer-bottom{
    border-top:1px solid var(--line-l);padding-top:22px;
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
    font-size:12px;color:var(--slate);
  }
  .lgpd-footer{
    margin-top:12px;font-size:11.5px;color:var(--slate);line-height:1.5;
